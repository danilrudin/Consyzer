name: Release

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    concurrency:
      group: consyzer-release-master
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Compare project versions
        id: version
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = dotnet msbuild Consyzer/Consyzer.csproj -nologo -p:Configuration=Release -getProperty:Version
          $base = Join-Path $env:RUNNER_TEMP consyzer-base
          git worktree add --detach $base $env:BASE_SHA
          $previous = dotnet msbuild "$base/Consyzer/Consyzer.csproj" -nologo -p:Configuration=Release -getProperty:Version
          foreach ($value in $version, $previous) {
            if ($value -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw "MSBuild Version must be a stable major.minor.patch value; got '$value'."
            }
          }
          if ([version]$version -lt [version]$previous) { throw 'Project version must not decrease.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "changed=$(($version -ne $previous).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Check release state
        id: release
        uses: actions/github-script@v8
        env:
          TAG: v${{ steps.version.outputs.version }}
          VERSION_CHANGED: ${{ steps.version.outputs.changed }}
        with:
          script: |
            const tag = process.env.TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const release = releases.find(release => release.tag_name === tag);
            const published = release && !release.draft;
            if (!published || process.env.VERSION_CHANGED === 'true') {
              // Query the ref first because getCommit can return 422 for a missing tag.
              const tagRef = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` }).catch(error => {
                if (error.status === 404) return null;
                throw error;
              });
              if (tagRef) {
                const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: `refs/tags/${tag}` });
                if (commit.sha !== context.sha) throw new Error(`${tag} points to another commit.`);
              }
            }
            if (release?.draft && release.target_commitish !== context.sha) throw new Error('Existing draft belongs to another commit.');
            if (published) { core.info(`${tag} is already published.`); return; }
            const newer = releases.find(release => !release.draft && !release.prerelease &&
              /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(release.tag_name) &&
              release.tag_name.localeCompare(tag, 'en', { numeric: true }) > 0);
            if (newer) { core.notice(`Skipping ${tag}: ${newer.tag_name} is already published.`); return; }
            core.setOutput('create', !release);
            core.setOutput('publish', true);
      - uses: actions/download-artifact@v8
        if: steps.release.outputs.publish == 'true'
        with:
          pattern: Consyzer-${{ steps.version.outputs.version }}-*-x64
          path: artifacts
          merge-multiple: true
      - name: Publish release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: ${{ steps.release.outputs.create == 'true' }}
          make_latest: legacy
          fail_on_unmatched_files: true
          files: |
            artifacts/Consyzer-${{ steps.version.outputs.version }}-win-x64.zip
            artifacts/Consyzer-${{ steps.version.outputs.version }}-linux-x64.tar.gz
