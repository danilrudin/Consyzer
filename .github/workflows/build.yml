name: Build

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux-tests:
    name: Linux build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Consyzer.slnx

      - name: Build
        run: dotnet build Consyzer.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test Consyzer.Tests/Consyzer.Tests.csproj
          --configuration Release
          --no-build
          --no-restore

      - name: Publish
        run: >-
          dotnet publish Consyzer/Consyzer.csproj
          --configuration Release
          --no-build
          --self-contained false
          --output _publish/Consyzer

      - name: Package application
        run: tar -czf _publish/Consyzer-linux.tar.gz -C _publish/Consyzer .

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Consyzer-linux
          path: _publish/Consyzer-linux.tar.gz
          if-no-files-found: error

  windows-build:
    name: Windows build, tests and analysis
    runs-on: windows-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Consyzer.slnx

      - name: Install SonarScanner
        if: github.event_name == 'push' || env.SONAR_TOKEN != ''
        run: >-
          dotnet tool install dotnet-sonarscanner
          --version 11.2.1
          --tool-path .\.sonar\scanner

      - name: Start SonarCloud analysis
        if: github.event_name == 'push' || env.SONAR_TOKEN != ''
        shell: pwsh
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin `
            /k:"danilrudin_Consyzer" `
            /o:"danilrudin" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.dotnet.excludeTestProjects=true `
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"

      - name: Build
        run: dotnet build Consyzer.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >-
          dotnet test Consyzer.Tests/Consyzer.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory "$env:GITHUB_WORKSPACE\TestResults"

      - name: End SonarCloud analysis
        if: github.event_name == 'push' || env.SONAR_TOKEN != ''
        run: .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      - name: Publish
        run: >-
          dotnet publish Consyzer/Consyzer.csproj
          --configuration Release
          --no-build
          --self-contained false
          --output _publish/Consyzer

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Consyzer-windows
          path: _publish/Consyzer
          if-no-files-found: error
